[env]
EDITOR = "nvim"
SUDO_EDITOR = "nvim"

[path]
entries = ["$HOME/.local/bin", "$HOME/.cargo/bin", "/usr/local/bin"]

[aliases]
ll = "ls -al"
p = "pnpm"
gba = "git branch -a"
gpaa = "git add . --all && git commit --amend --no-edit && git push origin --force-with-lease"
gpaanv = "git add . --all && git commit --amend --no-edit && git push origin --force-with-lease --no-verify"
grbi = "git rebase upstream/master -i"
gph = "git push heroku master"
gaa = "git add -A"
gd = "git diff"
gs = "git status --short"
gco = "git checkout"
gcp = "git cherry-pick"
gci = "git commit"
gcia = "git commit --amend --no-edit"
grb = "git rebase -i"
gmf = "git diff --name-only"
gp = "git pull"
gpp = "git push"
gfa = "git fetch --all"
gfu = "git fetch upstream"
grh = "git reset --hard"
rho = "dotfiles util rho"
rhu = "dotfiles util rhu"
gmt = "git mergetool"
gl = "git log --oneline --graph"
shipit = "npm run deploy"
gpft = "git push --follow-tags"
npmv = "dotfiles util npmv"
hosts = "sudo nvim /etc/hosts"
amisafe = "ps auxwww | grep sshd"
v = "nvim"
e = "nvim"
pr = "gh pr checkout"
cc = "claude --dangerously-skip-permissions"
ccc = "claude --dangerously-skip-permissions"
theirs = "git checkout --theirs"
theme = "$DOT_DIR/bin/theme-switch"
lt = "eza --tree --level=2 --long --icons --git --git-ignore --ignore-glob=.git"
lg = "lazygit"
ld = "lazydocker"
ds = "devbox shell"
killport = "dotfiles util killport"
ipp = "dotfiles util ipp"
ipl = "dotfiles util ipl"
dockersh = "dotfiles util dockersh"
docker = "dotfiles util docker"
clone = "gh repo clone"
gif = "$HOME/scripts/gif"
empty-trash = "dotfiles util empty-trash"
gcommits = "dotfiles util gcommits"
use = "dotfiles util use"
killname = "dotfiles util killname"
node_admin = "dotfiles util node-admin"
bwload = "dotfiles util bwload"
gt = "dotfiles util git-test"
git_test = "dotfiles util git-test"
power = "upower -i /org/freedesktop/UPower/devices/battery_BAT0"
denode = "deno run -A --unstable"
codeai = "dotfiles util codeai"
speakai = "dotfiles util speakai"
pie_score = "dotfiles util pie-score"
check_for_devbox = "dotfiles util check-devbox"
ai = "opencode"
wt = "dotfiles worktree open"
wtd = "dotfiles worktree delete"
jc = "dotfiles worktree jira"
jira_claude = "dotfiles worktree jira"
zellij_branch_repo = "dotfiles worktree open"
zellij_branch_repo_delete = "dotfiles worktree delete"
worktree_delete_all = "dotfiles worktree delete-all"
wtda = "dotfiles worktree delete-all"
wtl = "git worktree list"
