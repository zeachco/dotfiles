; Router presets for the "heavy" tier -- one model at a time (--models-max 1).
version = 1

[*]
ngl = 999
fa = on
jinja = true
; large models hit allocator failures during graph warmup
no-warmup = true
spec-type = ngram-mod

; 90.9 GiB hand-tuned mixed quant, arch deepseek4.
; c starts small and gets sized up from the measured KV buffer -- see Phase 2.
; cache-type-k must equal cache-type-v: llama-context.cpp:3591 rejects a
; mismatch for MLA / DEEPSEEK4.
[DeepSeek-V4-Flash-chat-v2]
c = 32768
np = 1
cache-type-k = q8_0
cache-type-v = q8_0

; --- pending fetch-models.sh -------------------------------------------------
; Workhorse, 63.4 GB MXFP4. The repo also ships a matching EAGLE3 draft, which is a
; real decode win on a bandwidth-bound APU -- overrides the [*] ngram-mod setting.
[gpt-oss-120b-MXFP4]
c = 131072
np = 1
model-draft = /home/olivier/models/drafts/eagle3-gpt-oss-120b-Q8_0.gguf
spec-type = draft-eagle3
; The draft's GPU-layer count defaults to 'auto', which fits to memory FREE AT LOAD TIME --
; with another heavy model still resident that can silently leave the 0.8 GB draft on the
; CPU, and a CPU-side draft turns speculation into a slowdown. Pin it like [*] pins ngl.
spec-draft-ngl = 999

; Qwen3.8-Flash-Next: 125B + 51B n-gram embedding, 6B active. UD-IQ4_XS, ~87 GiB,
; three shards. Hybrid attention (Gated DeltaNet + QSA) needs the qwen4exp
; architecture support in llama.cpp. Keep this on the heavy tier: it cannot share
; the GPU with the daily light models. Drain :7070 before loading it.
[Qwen3.8-Flash-Next]
c = 131072
np = 4
kv-unified = true

; GLM-5.3-Flash: 320B total / 18B active. UD-Q2_K_XL, ~101 GiB plus the
; projector. This is deliberately conservative until its first load is measured;
; one heavy model at a time leaves the most room for KV and compute buffers.
; llama.cpp support is currently in the upstream GLM-5-Next PR, so the build must
; include that support before this model can load.
[GLM-5.3-Flash]
c = 65536
np = 1
kv-unified = true
