; Router presets for the "heavy" tier -- one model at a time (--models-max 1).
version = 1

[*]
ngl = 999
fa = on
jinja = true
; large models hit allocator failures during graph warmup
no-warmup = true
spec-type = ngram-mod

; 90.9 GiB hand-tuned mixed quant, arch deepseek4.
; c starts small and gets sized up from the measured KV buffer -- see Phase 2.
; cache-type-k must equal cache-type-v: llama-context.cpp:3591 rejects a
; mismatch for MLA / DEEPSEEK4.
[DeepSeek-V4-Flash-chat-v2]
c = 32768
np = 1
cache-type-k = q8_0
cache-type-v = q8_0

; --- pending fetch-models.sh -------------------------------------------------
; Workhorse, 63.4 GB MXFP4. The repo also ships a matching EAGLE3 draft, which is a
; real decode win on a bandwidth-bound APU -- overrides the [*] ngram-mod setting.
[gpt-oss-120b-MXFP4]
c = 131072
np = 1
model-draft = /home/olivier/models/drafts/eagle3-gpt-oss-120b-Q8_0.gguf
spec-type = draft-eagle3

; Qwen3.8-Flash-Next: 125B + 51B n-gram embedding, 6B active. UD-IQ4_XS, ~87 GiB,
; 3 shards. Hybrid attention (Gated DeltaNet + QSA): KV cost unmeasured here, so c
; starts at 131072 -- read the child's "KV buffer size" line before raising.
; Needs the qwen4exp arch, which merged upstream 2026-09-05 as #27742 plus four
; follow-up fixes (#27880 graph splits, #27941 seq_cp/mtmd, #28023 indexer heads,
; #28123 recurrent state rollback) -- so track master, not the PR branch. update.sh
; keeps the build in sync; a build behind those commits fails at load with
;   error loading model: unknown model architecture: 'qwen4exp'
;
; np=4: slots are sticky per conversation (see light.ini), so np must cover the
; concurrent clients even on a one-model tier. kv-unified so a single long chat can
; use the whole pool rather than c/np. Moved here from light.ini 2026-09-08: at ~87 GiB
; it cannot share the GPU with qwen3.8 + GLM, and on the light tier it would load by
; evicting them. `los-drain` on :7070 first, then load.
; MEASURED 2026-09-09, first load on this tier (llama.cpp e2d2c0d6, Vulkan): 30 s to
; loaded, 67 GiB GTT for the child (amdgpu fdinfo) plus 28 GiB host RSS -- the 51B
; n-gram/PLE table is mmapped in RAM, not on the GPU -- so ~95 of the 125 GiB unified
; memory. That is why `los-drain` is not optional: with qwen3.8 (27-40 GiB) still resident
; the load fails. Cold: 58 tok/s prompt, 27 tok/s generation at c = 131072 f16 KV.
[Qwen3.8-Flash-Next]
c = 131072
np = 4
kv-unified = true
