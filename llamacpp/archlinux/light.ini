; Router presets for the "light" tier -- see docs/ryzen-llm-setup.md Phase 1.
; Keys are llama-server CLI args without the leading dashes. Precedence:
; router CLI args > model section > [*].
version = 1

[*]
ngl = 999
fa = on
jinja = true
c = 65536
; np must be >= the number of concurrent clients, NOT lower. Slots are sticky per
; conversation: when a client is routed to a slot holding a DIFFERENT client's
; context the prefix cache misses and the whole prompt is re-ingested. With 4-5
; agents against np=2 that is a permanent thrash loop -- measured 2026-09-04 with
; slot 0 holding 87k tokens generating at 0.06 t/s while slot 1 re-ingested 45k at
; ~116 t/s. Continuous batching merges both into one batch, so the generating slot
; advances exactly one token per prompt-processing chunk. Size np to client count.
np = 4
; Recover a drifted prefix by KV-shifting instead of re-ingesting from scratch.
; Default is 0 (disabled), which is what made every cache miss cost a full re-ingest.
;
; INERT ON EVERY MODEL THAT HAS AN mmproj. The child logs, at info level only:
;   "cache_reuse is not supported by multimodal, it will be disabled"
; qwen3.8's projector was retired 2026-10-12 (moved to ~/models/retired/), so it
; honours this: concurrent agents sharing the same system prompt share prefilled KV
; instead of every slot re-ingesting. The gemmas still pair an mmproj (vision), so
; they stay exempt -- gemma-4-E2B is the light tier's vision path, see the note at
; the bottom of this file.
cache-reuse = 256
; ngram speculation needs no draft model and pays off on coding loops, where
; output re-emits large spans of the prompt. Default is "none", so it must be
; named explicitly. Alternatives: ngram-simple, ngram-map-k, ngram-map-k4v.
spec-type = ngram-mod
; Sleep: a child with no request for this many seconds frees its weights and KV
; (llama.cpp "Sleeping on Idle", PR #18228) and reloads on the next one. This is
; the memory half the router lacks: --models-max counts models, never bytes, so
; without it every autoloaded model stays pinned in GTT until LRU evicts it --
; which is how GLM-4.7-Flash came in as the fifth resident model on 2026-10-11
; 12:12 and the box OOMed. Waking costs little in load time (median from 21 days
; of journals, 2026-10-11: qwen3.8 8 s, GLM-4.7 12 s, gemma-E4B 16 s, Nimble 3 s)
; but sleeping also discards the KV pool and the cache-ram prompt cache, so the
; next message re-ingests the whole conversation (~200 tok/s on qwen3.8). Hence
; one minute here for the small and fan-out models, and longer per model below.
;
; Only a metrics task is ignored by the idle timer (server-queue.cpp
; task_resets_idle_timer), so the /slots probes from framework-rgb and the los
; menu do not keep a model awake. But /slots DOES wake a sleeper -- only /health
; /props /models /metrics bypass sleep -- so every prober must skip models whose
; status is "sleeping". framework-rgb and _los_menu.sh do; keep it that way.
;
; Waking re-runs load_model() with the args the child was SPAWNED with, and
; server-context.cpp:1075 GGML_ABORTs the child if that reload fails. So never move
; or rename a GGUF or mmproj under a running router: the router keeps its start-time
; model list and args and would respawn the same dead paths. Restart the router
; first, then move files. (2026-10-12: qwen3.8's projector was retired while its child
; was up -- the child kept serving, but its first 30-min idle would have killed it.)
sleep-idle-seconds = 60

; Small/fast tier. Native context is 32k, so c/np is sized to land there per slot
; rather than inheriting the [*] 65536/4 = 16k.
[gemma-4-E4B-it-GGUF]
c = 131072
np = 4

; Fast default for the harness. 27.3B qwen35 Q4_K_M. The clip projector was retired
; 2026-10-12 (~/models/retired/qwen3.8-mmproj-F16.gguf): it disabled cache-reuse
; ("cache_reuse is not supported by multimodal") and the single-model consolidation
; made a second vision model unnecessary -- gemma-4-E2B carries vision on this tier.
; np divides c between slots: 393216/6 = 65536 per slot, sized for 6 concurrent
; agents each holding a long coding conversation.
;
; KV budget: hybrid attention (Gated DeltaNet + QSA) costs ~64 KiB/token unquantized,
; so 393216 tokens is ~24 GiB unquantized, ~40 GiB with weights -- fits the CURRENT
; 62.5 GiB GTT cap, before the Phase 0 reboot. MEASURED 2026-10-12 (fdinfo
; drm-memory-gtt on the running child): 32.5 GiB total with q8_0 at this c, i.e.
; ~17 GiB of KV + compute over 15.3 GiB of weights, ~41 KiB/token. q8_0 did cut it,
; but llama.cpp
; only quantizes the full-attention layers on a hybrid model: read the child's
; "KV buffer size" line before raising c toward 524288 (85k/slot) post-reboot.
;
; Phase 2 note 3 still applies: type_k and type_v must match, quantize both or neither.
;
; kv-unified: one shared KV pool instead of six fixed c/np partitions. Same total
; allocation (c tokens either way), but n_ctx_slot becomes the FULL c for every slot
; (server-context.cpp:1211, llama_n_ctx_seq), so one long chat can use the whole pool
; and short ones coexist, instead of every slot pinning 65536 tokens whether or not
; its chat is active.
;
; The payoff needs cache-ram. With --cache-idle-slots (default on) an idle slot is
; written to the RAM prompt cache and its KV CLEARED from the pool on the next task --
; but only under unified KV. server-context.cpp:1404 [TAG_IDLE_SLOT_CLEAR] spells out
; that without it "clearing a slot frees no reusable room", which was our situation.
; Restore is a copy from RAM, not a re-ingest. Default cache-ram is only 8192 MiB.
;
; 16 GiB, not the 32 GiB it was until 2026-10-12. "Of 125 GiB" was the wrong budget:
; the GPU pins up to the GTT cap (62.5 GiB until Phase 0) OUTSIDE every RSS, and swap
; on this box is zram (125 GiB disksize, zstd), so a "swapped out" page still costs
; ~0.65x its size in RAM. MEASURED 2026-10-12 on the running child: 14.4 GiB RSS +
; 14.9 GiB VmSwap -- the whole 32 GiB cache resident one way or the other, evicting
; 1.3-9.1 GiB entries to make room. At the 2026-10-11 12:13 OOM every process had
; anon-rss 0 and zram held 58 GiB compressed. A 131072-token chat is ~5.5 GiB at the
; ~41 KiB/token measured below, so 16 GiB still parks three full-window chats.
;
; Tradeoff: fairness for utilization. A static split guarantees each agent 65536
; tokens; a shared pool lets one greedy chat crowd the others, and contention shows up
; as ERROR_TYPE_EXCEED_CONTEXT_SIZE (server-context.cpp:3161) rather than a clean queue.
; MEASURED 2026-09-06, before the Phase 0 reboot (GTT cap still 62.5 GiB):
;   n_ctx_slot   65536 -> 262144   (4x the per-chat ceiling)
;   GTT used     32.02 -> 32.29 GiB (unchanged, as expected -- same c either way)
;   gen tok/s     9.07 -> 12.23    (live tg_3s 10.3-10.8 -> 12.2-12.4)
;
; c = 393216 is deliberately ABOVE the model's 262144 native context. The pool is the
; full 393216 -- so several chats can sum to it -- but any SINGLE slot is capped to the
; training context (server-context.cpp:1212), which logs two warnings at load:
;   n_ctx_seq (393216) > n_ctx_train (262144) -- possible training context overflow
;   the slot context (393216) exceeds the training context of the model (262144) - capping
; Both are expected and correct here. Do NOT "fix" them by dropping c to 262144: that
; shrinks the shared pool and costs concurrency, while the per-chat ceiling is imposed
; by the model either way.
;
; Revert both keys if long chats start getting evicted mid-session.
[qwen3.8]
c = 393216
np = 6
cache-type-k = q8_0
cache-type-v = q8_0
kv-unified = true
cache-ram = 16384
; Per-slot ceiling inside the shared pool (--kv-unified-per-slot, newer than the
; pool setup above). Without it n_ctx_slot is the full pool, so one long chat can
; take all 393216 and the next one hits ERROR_TYPE_EXCEED_CONTEXT_SIZE at whatever
; is left -- the "fairness for utilization" tradeoff. 131072 guarantees three
; agents a full window at the same time; the pool is unchanged. llamacpp-sync and
; the audit read this as the per-slot context, so pi compacts at 128k, not 256k.
; Three, not six: MEASURED 2026-10-12 16:37, four pi chats generating at once (the
; one slot that logged its size held 79507 tokens) filled the 393216 pool -- "failed
; to find free space in the KV cache", n_batch retried down to 1, then "Context size
; has been exceeded" -- and two of the four were cancelled mid-turn. Levers, in
; order: raise c to 524288 after Phase 0 (~41 KiB/token, so about +5.3 GiB of GTT,
; which the 62.5 GiB cap cannot spare beside the gemmas and Nimble), or drop this to
; 98304 for a four-agent guarantee at a 96k window.
kv-unified-per-slot = 131072
; The daily driver: the wake cost is re-ingesting parked coding sessions (a 60k
; chat is ~5 min at 200 tok/s), not the 8 s load. Half an hour idle before sleep.
sleep-idle-seconds = 1800

; GLM-4.7-Flash-UD-Q4_K_XL was retired 2026-10-12. The second ~27 GiB resident
; (17 weights + 202752-token MLA KV) does not fit beside qwen3.8's 32.5 GiB inside
; the 62.5 GiB GTT cap: on 2026-10-11 12:12 it came in as the fifth child, the GPU
; pinned exactly the cap (kernel OOM dump: gpu_active 65559424 kB) and the box OOMed;
; on 2026-10-12 12:25 and 13:08, with just the two of them resident, amdgpu logged
; "Not enough memory for command submission" (runbook, "Incident: the OOM of
; 2026-10-11"). Its only consumers now run
; elsewhere: opencode's generate-code subagent targets qwen3.8, and pi-session-summary
; targets gemma-4-E2B (text-only, no thinking to eat the 300-token budget). The GGUF
; moved to ~/models/retired/ so the --models-dir scan cannot resurrect it -- a preset
; section alone would not be enough, auto-discovery reads the directory. If a fast
; local typer is wanted again, Qwen3-4B-Q4_K_M (2.4 GB, text-only, cache-reuse active)
; is the candidate: it costs ~2.4 GiB instead of ~27.

; Decision model, NOT chat: the router reports output_modalities = ["decisions"] and
; pi lists it only as a classifier (/v1/systemone, `typesafe-system-one`), so it never
; shows in /model. NIMBLE packs every question of a request into one prompt (its whole
; reason to exist vs. the per-question types), so it needs the state once, not twice;
; 32768 is generous for a codemode state.
;
; kv-unified keeps the pool equal to the per-slot ceiling, so the context pi reads off
; --ctx-size is the real one -- same mechanism and caveat as [qwen3.8] above. spec-type
; and cache-reuse are inherited from [*] and harmless here: the answers are read from
; one forward pass, and repeated classify prompts hit the prefix cache.
;
; It shares this router's --models-max budget with the daily chat models. A classify
; call that has to load it is an LRU touch on the light tier -- see the fetch-models.sh
; note beside the recipe before pointing anything high-frequency at it.
[Bespoke-Nimble-9B-v3-Q4_K_M]
c = 32768
np = 2
kv-unified = true

; Memory warning: --models-max evicts on model *count*, never on bytes, and
; sleep-idle-seconds only gives memory BACK after idling -- nothing here refuses a
; load that does not fit (that is open upstream as --models-memory-max). The GTT cap
; is 62.5 GiB, NOT ~120: Phase 0 of the runbook was never applied on this install
; (mem_info_gtt_total = 67151831040, verified 2026-10-12), and that cap is what
; killed the router on 2026-10-11. Budget against it (2026-10-12, GTT):
;   qwen3.8        32.5 GiB  measured (fdinfo) at c=393216 q8_0; weights are 15.3
;   gemma-4-E4B     ~8 GiB   estimate: 5 weights + 1 projector + KV for 131072
;   gemma-4-E2B     ~6 GiB   estimate: 3 + 1 + KV for 65536
;   Nimble-9B       ~8 GiB   estimate: 6 + KV for 32768
; ~55 GiB for the daily four, so llama-router.service runs --models-max 4 until
; Phase 0: anything beyond them becomes an LRU eviction instead of a fifth resident,
; which is exactly the 2026-10-11 shape. Still hazardous by hand: gemma-4-26B-A4B is
; auto-discovered from ~/models/light at ~20 GiB and only fits beside qwen3.8 plus ONE
; small model (never loaded in the 7 days to 2026-10-12; park it in ~/models/retired
; if it stays unused). Host RAM is the other half: the GTT pin comes out of the same
; 125 GiB, so with the GPU full ~60 GiB is left for the desktop, zram and every
; child's cache-ram. Anything that does NOT fit next to those -- gpt-oss-120b
; (~63 GiB), DeepSeek (91) -- belongs in ~/models/heavy behind
; llama-router-heavy.service (:7072, heavy.ini), where loading it is an explicit
; `los-drain` + load instead of an LRU eviction of the daily models.
;
; Eviction hazard, and why the cheap tier exists: the victim is chosen by pure LRU on
; last_used (server-models.cpp pick_victim), skipping only models mid-request, and
; there is NO way to protect a model -- the `pin` preset key is commented out in
; llama.cpp's common/arg.cpp. Since every proxied request refreshes its target's
; last_used, any high-frequency caller keeps its own small model freshest and makes
; the biggest model here the victim. That is exactly what summarize()/tab_autoname()
; were doing, which is why they now run against llama-router-cheap.service on :7071
; (see cheap.ini). Keep it that way: do not point shell helpers or a fan-out subagent
; loop at this router's small models.
;
; gemma-4-E2B is intentionally absent from this file but present in ~/models/light,
; so the router still auto-discovers it from --models-dir with the [*] defaults. It
; is the light tier's ONLY vision model now (its mmproj sidecar lives alongside it;
; qwen3.8's projector was retired 2026-10-12 for prefix reuse); the cheap tier
; symlinks the text weights only. pi-session-summary also targets this model -- a
; debounced, token-thresholded background call (60 s / 40k tokens), not the
; high-frequency shell traffic the cheap-tier split was made for, so it stays on
; this router: during an active session the main session keeps qwen3.8 freshest, so
; LRU cannot take it down.
