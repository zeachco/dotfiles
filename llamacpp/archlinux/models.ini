; Router presets for THE router -- one llama-server in router mode on :7070, serving
; ~/models/llama. Keys are llama-server CLI args without the leading dashes.
; Precedence: router CLI args > model section > [*].
;
; 2026-11-06: light.ini / cheap.ini / heavy.ini were merged into this file when the
; three routers (:7070 light, :7071 cheap, :7072 heavy) became one. The unit runs
; --no-models-autoload, so NOTHING here loads on its own: a request for a model that is
; not resident is refused with 400 "model is not loaded", and every load is an explicit
; `los` / `los-load` / POST /models/load. That is what made the tiers unnecessary --
; they existed to keep the router's LRU autoload-eviction from pulling a 30 GiB model
; under a coding session, and with autoload off there is no eviction to fence off.
; Memory is the only budget, and it is yours: nothing refuses a load that does not fit
; (open upstream as --models-memory-max), so read the `los` preview before loading.
; --models-max is 8 so it never decides for you; see llama-router.service.
version = 1

[*]
ngl = 999
fa = on
jinja = true
c = 65536
; np must be >= the number of concurrent clients, NOT lower. Slots are sticky per
; conversation: when a client is routed to a slot holding a DIFFERENT client's
; context the prefix cache misses and the whole prompt is re-ingested. With 4-5
; agents against np=2 that is a permanent thrash loop -- measured 2026-09-04 with
; slot 0 holding 87k tokens generating at 0.06 t/s while slot 1 re-ingested 45k at
; ~116 t/s. Continuous batching merges both into one batch, so the generating slot
; advances exactly one token per prompt-processing chunk. Size np to client count.
np = 4
; Recover a drifted prefix by KV-shifting instead of re-ingesting from scratch.
; Default is 0 (disabled), which is what made every cache miss cost a full re-ingest.
;
; INERT ON EVERY MODEL THAT HAS AN mmproj. The child logs, at info level only:
;   "cache_reuse is not supported by multimodal, it will be disabled"
; qwen3.8's projector was retired 2026-10-12 (moved to ~/models/retired/), so it
; honours this: concurrent agents sharing the same system prompt share prefilled KV
; instead of every slot re-ingesting. The gemmas still pair an mmproj (vision), so
; they stay exempt -- gemma-4-E2B is the vision path, see the note at the bottom.
cache-reuse = 256
; ngram speculation needs no draft model and pays off on coding loops, where
; output re-emits large spans of the prompt. Default is "none", so it must be
; named explicitly. Alternatives: ngram-simple, ngram-map-k, ngram-map-k4v.
spec-type = ngram-mod
; Sleep: a child with no request for this many seconds frees its weights and KV
; (llama.cpp "Sleeping on Idle", PR #18228) and reloads on the next one. A sleeping
; child is still "loaded" to the router, so a request WAKES it rather than being
; refused by --no-models-autoload: sleep gives memory back without changing which
; models you chose to have resident. Waking costs little in load time (median from
; 21 days of journals, 2026-10-11: qwen3.8 8 s, GLM-4.7 12 s, gemma-E4B 16 s,
; Nimble 3 s) but sleeping also discards the KV pool and the cache-ram prompt
; cache, so the next message re-ingests the whole conversation (~200 tok/s on
; qwen3.8). Hence one minute here for the small and fan-out models, and longer per
; model below.
;
; Only a metrics task is ignored by the idle timer (server-queue.cpp
; task_resets_idle_timer), so the /slots probes from framework-rgb and the los
; menu do not keep a model awake. But /slots DOES wake a sleeper -- only /health
; /props /models /metrics bypass sleep -- so every prober must skip models whose
; status is "sleeping". framework-rgb and _los_menu.sh do; keep it that way.
;
; Waking re-runs load_model() with the args the child was SPAWNED with, and
; server-context.cpp:1075 GGML_ABORTs the child if that reload fails. So never move
; or rename a GGUF or mmproj under a running router: the router keeps its start-time
; model list and args and would respawn the same dead paths. Restart the router
; first, then move files. (2026-10-12: qwen3.8's projector was retired while its child
; was up -- the child kept serving, but its first 30-min idle would have killed it.)
sleep-idle-seconds = 60

; ===================================================================================
; Daily models
; ===================================================================================

; Small/fast. Native context is 32k, so c/np is sized to land there per slot
; rather than inheriting the [*] 65536/4 = 16k.
[gemma-4-E4B-it-GGUF]
c = 131072
np = 4

; The shell helpers' model: summarize() and tab_autoname() in
; variants/shared/_ai_tools.sh resolve "gemma-4-E2B-it" against /v1/models and land
; here. It used to be the whole cheap tier (:7071, text-only symlink, 32768/4) so that
; its high-frequency traffic could never make qwen3.8 the LRU-eviction victim on the
; autoloading light router. With autoload off there is nothing to protect: load it
; when you want tab titles, and it costs ~6 GiB while awake. Served WITH its mmproj
; now (same directory as the vision path), so cache-reuse is inert on it -- the
; repeated summarize prompts lose prefix reuse, which at this size is not worth a
; second copy of the weights.
;
; c/np sized for one-shot calls, not conversations: 32768/4 = 8192 tokens per slot,
; comfortably above a long PR body, and np=4 because a batch of tab renames fires
; several summarize calls at once (_ai_tools.sh notes they queue). _ai_tools.sh bounds
; every call with a 60 s curl timeout and falls back gracefully when the model is not
; resident, so an unloaded model costs a missing title, not a hang.
; Ten minutes keeps a session instant and still hands the memory back when nobody is
; at the desk.
[gemma-4-E2B-it-GGUF]
c = 32768
np = 4
sleep-idle-seconds = 600

; The daily driver. 27.3B qwen35 Q4_K_M. The clip projector was retired
; 2026-10-12 (~/models/retired/qwen3.8-mmproj-F16.gguf): it disabled cache-reuse
; ("cache_reuse is not supported by multimodal") and the single-model consolidation
; made a second vision model unnecessary -- gemma-4-E2B carries vision.
; np divides c between slots: 393216/6 = 65536 per slot, sized for 6 concurrent
; agents each holding a long coding conversation.
;
; KV budget: hybrid attention (Gated DeltaNet + QSA) costs ~64 KiB/token unquantized,
; so 393216 tokens is ~24 GiB unquantized, ~40 GiB with weights. MEASURED 2026-10-12
; (fdinfo drm-memory-gtt on the running child): 32.5 GiB total with q8_0 at this c,
; i.e. ~17 GiB of KV + compute over 15.3 GiB of weights, ~41 KiB/token. q8_0 did cut
; it, but llama.cpp only quantizes the full-attention layers on a hybrid model: read
; the child's "KV buffer size" line before raising c toward 524288 (85k/slot).
;
; type_k and type_v must match, quantize both or neither.
;
; kv-unified: one shared KV pool instead of six fixed c/np partitions. Same total
; allocation (c tokens either way), but n_ctx_slot becomes the FULL c for every slot
; (server-context.cpp:1211, llama_n_ctx_seq), so one long chat can use the whole pool
; and short ones coexist, instead of every slot pinning 65536 tokens whether or not
; its chat is active.
;
; The payoff needs cache-ram. With --cache-idle-slots (default on) an idle slot is
; written to the RAM prompt cache and its KV CLEARED from the pool on the next task --
; but only under unified KV. server-context.cpp:1404 [TAG_IDLE_SLOT_CLEAR] spells out
; that without it "clearing a slot frees no reusable room", which was our situation.
; Restore is a copy from RAM, not a re-ingest. Default cache-ram is only 8192 MiB.
;
; 16 GiB, not the 32 GiB it was until 2026-10-12. "Of 125 GiB" was the wrong budget:
; the GPU pins up to the GTT cap OUTSIDE every RSS, and swap on this box is zram
; (125 GiB disksize, zstd), so a "swapped out" page still costs ~0.65x its size in
; RAM. MEASURED 2026-10-12 on the running child: 14.4 GiB RSS + 14.9 GiB VmSwap -- the
; whole 32 GiB cache resident one way or the other, evicting 1.3-9.1 GiB entries to
; make room. At the 2026-10-11 12:13 OOM every process had anon-rss 0 and zram held
; 58 GiB compressed. A 131072-token chat is ~5.5 GiB at the ~41 KiB/token measured
; above, so 16 GiB still parks three full-window chats.
;
; Tradeoff: fairness for utilization. A static split guarantees each agent 65536
; tokens; a shared pool lets one greedy chat crowd the others, and contention shows up
; as ERROR_TYPE_EXCEED_CONTEXT_SIZE (server-context.cpp:3161) rather than a clean queue.
; MEASURED 2026-09-06:
;   n_ctx_slot   65536 -> 262144   (4x the per-chat ceiling)
;   GTT used     32.02 -> 32.29 GiB (unchanged, as expected -- same c either way)
;   gen tok/s     9.07 -> 12.23    (live tg_3s 10.3-10.8 -> 12.2-12.4)
;
; c = 393216 is deliberately ABOVE the model's 262144 native context. The pool is the
; full 393216 -- so several chats can sum to it -- but any SINGLE slot is capped to the
; training context (server-context.cpp:1212), which logs two warnings at load:
;   n_ctx_seq (393216) > n_ctx_train (262144) -- possible training context overflow
;   the slot context (393216) exceeds the training context of the model (262144) - capping
; Both are expected and correct here. Do NOT "fix" them by dropping c to 262144: that
; shrinks the shared pool and costs concurrency, while the per-chat ceiling is imposed
; by the model either way.
;
; Revert both keys if long chats start getting evicted mid-session.
[qwen3.8]
c = 393216
np = 6
cache-type-k = q8_0
cache-type-v = q8_0
kv-unified = true
cache-ram = 16384
; Per-slot ceiling inside the shared pool (--kv-unified-per-slot, newer than the
; pool setup above). Without it n_ctx_slot is the full pool, so one long chat can
; take all 393216 and the next one hits ERROR_TYPE_EXCEED_CONTEXT_SIZE at whatever
; is left -- the "fairness for utilization" tradeoff. 131072 guarantees three
; agents a full window at the same time; the pool is unchanged. llamacpp-sync and
; the audit read this as the per-slot context, so pi compacts at 128k, not 256k.
; Three, not six: MEASURED 2026-10-12 16:37, four pi chats generating at once (the
; one slot that logged its size held 79507 tokens) filled the 393216 pool -- "failed
; to find free space in the KV cache", n_batch retried down to 1, then "Context size
; has been exceeded" -- and two of the four were cancelled mid-turn. Levers, in
; order: raise c to 524288 (~41 KiB/token, so about +5.3 GiB of GTT), or drop this
; to 98304 for a four-agent guarantee at a 96k window.
kv-unified-per-slot = 131072
; The daily driver: the wake cost is re-ingesting parked coding sessions (a 60k
; chat is ~5 min at 200 tok/s), not the 8 s load. Half an hour idle before sleep.
sleep-idle-seconds = 1800

; Decision model, NOT chat: the router reports output_modalities = ["decisions"] and
; pi lists it only as a classifier (/v1/systemone, `typesafe-system-one`), so it never
; shows in /model. NIMBLE packs every question of a request into one prompt (its whole
; reason to exist vs. the per-question types), so it needs the state once, not twice;
; 32768 is generous for a codemode state.
;
; kv-unified keeps the pool equal to the per-slot ceiling, so the context pi reads off
; --ctx-size is the real one -- same mechanism and caveat as [qwen3.8] above. spec-type
; and cache-reuse are inherited from [*] and harmless here: the answers are read from
; one forward pass, and repeated classify prompts hit the prefix cache.
;
; A classify call does NOT load it any more (no autoload): load it alongside qwen3.8
; when a session needs the local classifier, ~8 GiB.
[Bespoke-Nimble-9B-v3-Q4_K_M]
c = 32768
np = 2
kv-unified = true

; GLM-4.7-Flash: 30B class, UD-Q4_K_XL, 16.32 GiB. Same file as the Mac's local default.
; Its 202752-token MLA KV makes it a ~27 GiB resident, which is why it was pulled off
; the autoloading light tier on 2026-10-12 (it OOMed the box beside qwen3.8 under the
; old 62.5 GiB GTT cap) and parked on the one-at-a-time heavy router. Loaded on purpose
; it is just another model: four slots over one unified pool. No per-slot ceiling:
; Cindy declares the full 202752 window for this model and does not compact before it,
; so a 65536 per-slot cap (the old opencode value) rejected any chat past 64k with
; EXCEED_CONTEXT_SIZE (2026-11-04). One long chat may take the whole pool; short
; fan-out chats share what is left.
; Fan-out model: short chats, 12 s load, ~250 tok/s re-ingest.
; 2026-11-04 19:30 incident: a 61k chat was evicted from its slot by a fifth
; conversation (LCP similarity 0.135) and re-ingested all 61k a second time while a
; 46k chat ingested beside it; a third chat on the same GPU got 18 tokens in 3 min.
; Eviction is by slot count, never by free memory, so: eight slots in the shared
; pool; cache-ram parks an evicted slot in host RAM (restore = copy, not re-ingest);
; cache-reuse keeps the prefix across pi's edited prompts; ubatch 512 shortens each
; shared decode step so a generating slot gets a token every few seconds while
; another slot ingests (default 2048 = one token per 10-15 s at 50k depth). Half an
; hour idle, not one minute: sleeping discards the KV pool AND the cache-ram cache.
[GLM-4.7-Flash-UD-Q4_K_XL]
c = 202752
np = 8
kv-unified = true
cache-ram = 16384
cache-reuse = 256
ubatch-size = 512
sleep-idle-seconds = 1800

; ===================================================================================
; Big models -- one at a time in practice, by MEMORY, not by rule. Each of these wants
; most of the 125 GiB; `los` shows the measured footprint against free GTT before you
; load. Drain the daily set first (los -> drain idle).
; ===================================================================================

; 90.9 GiB hand-tuned mixed quant, arch deepseek4.
; c starts small and gets sized up from the measured KV buffer -- see the runbook,
; Phase 2. cache-type-k must equal cache-type-v: llama-context.cpp:3591 rejects a
; mismatch for MLA / DEEPSEEK4. no-warmup: large models hit allocator failures during
; graph warmup.
[DeepSeek-V4-Flash-chat-v2]
c = 32768
np = 1
cache-type-k = q8_0
cache-type-v = q8_0
no-warmup = true
sleep-idle-seconds = 1800

; --- opt-in in fetch-models.sh (LOS_FETCH_HEAVY=1) ----------------------------
; Workhorse, 63.4 GB MXFP4. The repo also ships a matching EAGLE3 draft, which is a
; real decode win on a bandwidth-bound APU -- overrides the [*] ngram-mod setting.
[gpt-oss-120b-MXFP4]
c = 131072
np = 1
no-warmup = true
sleep-idle-seconds = 1800
model-draft = /home/olivier/models/drafts/eagle3-gpt-oss-120b-Q8_0.gguf
spec-type = draft-eagle3
; The draft's GPU-layer count defaults to 'auto', which fits to memory FREE AT LOAD TIME --
; with another big model still resident that can silently leave the 0.8 GB draft on the
; CPU, and a CPU-side draft turns speculation into a slowdown. Pin it like [*] pins ngl.
spec-draft-ngl = 999

; Qwen3.8-Flash-Next: 125B + 51B n-gram embedding, 6B active. UD-IQ4_XS, ~87 GiB,
; four shards since 2026-11-06 (shard 00001 is a 10.9 MB metadata-only file with 0
; tensors -- the upstream layout, not a truncated download). Hybrid attention (Gated DeltaNet + QSA)
; needs the qwen4exp architecture support in llama.cpp (master since 2026-09-05).
; MEASURED 2026-09-09: 67 GiB GTT + 28 GiB host RSS (the mmapped embedding table),
; 27 tok/s decode, 58 tok/s cold prompt. Only a 4B-class model fits beside it.
;
; KV cost (GGUF header, 2026-11-06): 48 layers, full attention every 4th (12 layers of
; 2 KV heads x 256) plus a 4-head indexer cache; the 36 DeltaNet layers hold a fixed
; ~55 MiB state per slot. ~36 KiB/token at f16, ~18 KiB at q8_0 (every scaling layer
; is an attention layer here, so quantizing does halve it). Native context 262144.
; 4 slots over one 131072 pool = ~4.5 GiB of KV. For 200k-per-session: 2 slots at
; c = 400k is +10 GiB (fits); 4 slots at 800k needs q8_0 KV to fit (+10 GiB). The
; compute buffer at depth is the part the header cannot predict -- measure on load.
;
; unsloth also ships MTP draft heads (MTP/mtp-Qwen3.8-Flash-Next-*.gguf, 2026-10-06;
; 1.3-1.7x decode at low concurrency, output unchanged) and an mmproj. Neither is
; wired. Recipe, now that the GTT cap is raised:
;   fetch unsloth/Qwen3.8-Flash-Next-GGUF MTP/mtp-Qwen3.8-Flash-Next-Q8_0.gguf "$HOME/models/drafts"
;   model-draft = /home/olivier/models/drafts/mtp-Qwen3.8-Flash-Next-Q8_0.gguf
;   spec-type = draft-mtp
;   spec-draft-n-max = 2
;   spec-draft-ngl = 999
; Take the self-contained head, not a `shared-*` one: those borrow embeddings from
; the main model and need unsloth's fork. The mmproj is skipped because nothing here
; needs vision from this model.
[Qwen3.8-Flash-Next]
; 2026-11-06 14:07: four coding sessions (52k+44k+33k+3k tokens) filled the single
; 131072 pool and every slot got "Context size has been exceeded" at once. Same
; failure the [qwen3.8] entry measured on 2026-10-12, same remedy: a pool of
; 4 x 131072 with a per-slot ceiling, KV at q8_0 (~18 KiB/token, ~9 GiB for 512k).
c = 524288
np = 4
kv-unified = true
kv-unified-per-slot = 131072
cache-type-k = q8_0
cache-type-v = q8_0
no-warmup = true
sleep-idle-seconds = 1800

; GLM-5.3-Flash: 320B total / 18B active. UD-Q2_K_XL, ~101 GiB plus the
; projector. First load measured 2026-11-06: ~103 GiB GTT at c=65536 np=1, so two
; slots sharing a unified 131072 KV should land near 110 GiB; measure after reload.
; llama.cpp master has had GLM-5-Next support since 2026-09-30 (#27773, build
; b11279); any update.sh build after that date loads it.
[GLM-5.3-Flash]
c = 131072
np = 2
kv-unified = true
no-warmup = true
sleep-idle-seconds = 1800

; ===================================================================================
; Notes
; ===================================================================================
;
; Memory: --models-max evicts on model *count*, never on bytes, and sleep-idle-seconds
; only gives memory BACK after idling -- nothing here refuses a load that does not fit
; (that is open upstream as --models-memory-max). Budget against the GTT cap, which the
; `los` header prints (amdgpu.gttsize=131072 on the kernel command line gives ~126 GiB).
; Measured footprints (GTT, fdinfo):
;   qwen3.8              32.5 GiB  at c=393216 q8_0; weights are 15.3
;   GLM-4.7-Flash         ~27 GiB  17 weights + the 202752-token MLA KV
;   Qwen3.8-Flash-Next    67 GiB   + 28 GiB host RSS
;   DeepSeek-V4-Flash     91 GiB
;   gemma-4-E4B            ~8 GiB  estimate: 5 weights + 1 projector + KV for 131072
;   gemma-4-E2B            ~6 GiB  estimate: 3 + 1 + KV for 32768
;   Nimble-9B              ~8 GiB  estimate: 6 + KV for 32768
; Host RAM is the other half: the GTT pin comes out of the same 125 GiB, so with the
; GPU full what is left is for the desktop, zram and every child's cache-ram. The OOM
; killer cannot see GTT (it is pinned outside every RSS), so under pressure it kills
; whichever process has the most ORDINARY memory -- usually a big model's mmapped
; table, or a browser. See docs/ryzen-llm-setup.md "Incident: the OOM of 2026-09-09".
;
; gemma-4-26B-A4B and the small single-file models (Ministral-3B, Qwen3-4B,
; qwen2.5-coder-0.5b) have no section: auto-discovered from ~/models/llama with the
; [*] defaults (65536/4 = 16k per slot). Load by hand when wanted.
;
; The gemma-4-* models are the only vision models served (each pairs an mmproj
; sidecar; qwen3.8's projector was retired 2026-10-12 for prefix reuse). pi does not see the
; gemmas: bin/llamacpp-sync (PI_HIDDEN) keeps gemma-4-* out of pi's llamacpp provider
; since 2026-10-14. opencode and the los menu are the only clients that list them.
