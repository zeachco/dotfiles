; Router presets for the "cheap" tier -- see ryzen-llm-setup.md "The cheap tier".
; Keys are llama-server CLI args without the leading dashes. Precedence:
; router CLI args > model section > [*].
;
; WHY THIS TIER EXISTS -- it is not a performance tier, it is an isolation tier.
;
; The light router's eviction is pure LRU on last_used (llama.cpp
; tools/server/server-models.cpp pick_victim), it skips only models that are
; mid-request, and there is NO way to protect a model: the `pin` preset key is
; commented out in common/arg.cpp. Every proxied request refreshes its target's
; last_used (server-models.cpp:1500). So the high-frequency shell callers --
; summarize() and tab_autoname() in variants/shared/_ai_tools.sh, which fire on
; every herdr tab rename -- kept this small model permanently freshest and made
; the ~28 GiB qwen3.8 the eviction victim during any idle gap in a coding
; session. A tab title cost a multi-minute model reload.
;
; Splitting the shell traffic onto its own port and its own LLAMA_CACHE removes
; it from that race entirely. Do NOT add this model to light.ini, and do not add
; this port as an opencode/pi provider -- either move puts the traffic back.
version = 1

; Only one model here, so [*] and the section could be merged -- kept split to
; match light.ini/heavy.ini and to make adding a second cheap model obvious.
[*]
ngl = 999
fa = on
jinja = true

; Deliberately text-only: the mmproj-F16.gguf sidecar next to this model in
; ~/models/light is NOT symlinked into ~/models/cheap. Two reasons. It saves
; ~1 GiB resident, and more importantly llama.cpp disables prefix cache reuse on
; any multimodal model ("cache_reuse is not supported by multimodal, it will be
; disabled", info level only), so keeping vision here would silently cost the
; prefix reuse that repeated same-shape summarize prompts benefit most from.
; Vision on gemma stays available on the light tier.
cache-reuse = 256

; Summaries quote spans straight out of the prompt (PR titles, commit subjects),
; which is exactly the pattern ngram speculation wins on, and it needs no draft
; model. Default is "none", so it must be named explicitly.
spec-type = ngram-mod

; c/np sized for one-shot calls, not conversations: 32768/4 = 8192 tokens per
; slot, comfortably above a long PR body, and np=4 because a batch of tab
; renames fires several summarize calls at once (_ai_tools.sh notes they queue).
; Same slot-stickiness rule as light.ini applies -- np must be >= concurrent
; callers or slots thrash -- it is just far cheaper to satisfy at this size.
[gemma-4-E2B-it]
c = 32768
np = 4
