# vLLM models for the macOS box (M4 Pro, 48 GiB unified memory).
# Read by vllm/osx/vllm-ctl. One model for each line:
#
#   id | source | extra `vllm serve` arguments
#
#   id      The model name that clients send (--served-model-name). The ids are the
#           same as the llama.cpp router ids where the model is the same, so a
#           client can change provider and keep the model id.
#   source  A HuggingFace repository (`org/name`, read from the HF cache), or an
#           absolute path to a local checkpoint or `.gguf` file.
#   args    Passed to `vllm serve` as written. No quotes: the fields are split on
#           spaces.
#
# vLLM serves ONE model for each process. `vllm-ctl use <id>` stops the current
# model and starts the new one. There is no router and no autoload.
#
# MEMORY. --gpu-memory-utilization is the fraction of unified memory that the KV
# cache can grow to. It is a ceiling, not a reservation: vllm-metal allocates the
# pool lazily. The vllm-metal default is 0.92, which is too much on a box where the
# llama.cpp router can also hold a model. Unload the llama.cpp models first if you
# start a large model here (`los` -> drain).
#
# CONTEXT. --max-model-len is the per-request context. vLLM has no slots: all
# requests share one paged KV pool, and a request that does not fit waits.
#
# TOOLS. A model answers tool calls only with --enable-auto-tool-choice and the
# parser of its family (`vllm serve --help=all` lists them). --reasoning-parser moves
# the thinking text into `reasoning_content`.
#
# NOT MEASURED YET. The memory fractions and context sizes below are first values
# taken from the llama.cpp presets (llamacpp/osx/osx.ini). Measure and correct them
# after the first real load.

# --- daily models (MLX 4-bit, not on disk yet: `vllm-ctl fetch <id>`) --------------

# 16.1 GB. Same model as the llama.cpp id Qwen3.8-27B (hybrid attention).
Qwen3.8-27B | mlx-community/Qwen3.8-27B-4bit | --max-model-len 98304 --gpu-memory-utilization 0.6 --enable-auto-tool-choice --tool-call-parser hermes --reasoning-parser qwen3

# 3.6 GB. Vision (image input through the Gemma 4 sidecar).
gemma-4-E2B-it | mlx-community/gemma-4-e2b-it-4bit | --max-model-len 32768 --gpu-memory-utilization 0.3 --enable-auto-tool-choice --tool-call-parser gemma4 --reasoning-parser gemma4

# 5.2 GB. Vision.
gemma-4-E4B-it | mlx-community/gemma-4-e4b-it-4bit | --max-model-len 32768 --gpu-memory-utilization 0.3 --enable-auto-tool-choice --tool-call-parser gemma4 --reasoning-parser gemma4

# 16.9 GB. MLA attention. The llama.cpp id is GLM-4.7-Flash-UD-Q4_K_XL (a GGUF
# quant name), so this id is different on purpose.
GLM-4.7-Flash | mlx-community/GLM-4.7-Flash-4bit | --max-model-len 32768 --gpu-memory-utilization 0.6 --enable-auto-tool-choice --tool-call-parser glm47 --reasoning-parser glm47

# --- test model (already in the HF cache on this box) ------------------------------

# 1.2 GB bf16. Use it to test the service without a download.
# MEASURED 2026-11-16, with llama.cpp holding Qwen3.8-27B (21 GiB): 32768 tokens need
# a 3.5 GiB KV cache, and the engine found only 2.71 GiB at 0.2 and 3.3 GiB at 0.3, so
# it refused to start. The fraction is cut down to the memory that is free, so a
# larger number does not help on a full box. 16384 tokens start.
Qwen3-0.6B | Qwen/Qwen3-0.6B-MLX-bf16 | --max-model-len 16384 --gpu-memory-utilization 0.3 --enable-auto-tool-choice --tool-call-parser hermes --reasoning-parser qwen3
