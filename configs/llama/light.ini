; Router presets for the "light" tier -- see ryzen-llm-setup.md Phase 1.
; Keys are llama-server CLI args without the leading dashes. Precedence:
; router CLI args > model section > [*].
version = 1

[*]
ngl = 999
fa = on
jinja = true
c = 65536
np = 2
; ngram speculation needs no draft model and pays off on coding loops, where
; output re-emits large spans of the prompt. Default is "none", so it must be
; named explicitly. Alternatives: ngram-simple, ngram-map-k, ngram-map-k4v.
spec-type = ngram-mod

; Fast default for the harness. 27.3B qwen35 Q4_K_M + clip projector (vision).
; np divides c between slots: 262144/2 = 131072 per slot. Hybrid attention costs
; ~64 KiB/token here, so the KV cache lands around 16 GiB -- ~32 GiB with weights.
; Note: --models-max 4 cannot hold four models this size. Raise the GTT cap first
; (Phase 0) and let the router's LRU do the rest.
[qwen3.8]
c = 262144
np = 2

; --- pending fetch-models.sh -------------------------------------------------
; Loop engine: 80B total / 3B active, 256k native context.
; c starts conservative because this model's hybrid KV cost is unmeasured here --
; read the child's "KV buffer size" line, then raise. See Phase 2.
[Qwen3-Coder-Next-UD-IQ4_XS]
c = 131072
np = 2

; Fan-out tier for cheap subagents. 198k native context.
[GLM-4.7-Flash-UD-Q4_K_XL]
c = 131072
np = 2

; Memory warning: --models-max 4 evicts on model *count*, never on bytes. Post-reboot
; the GTT cap is ~120 GiB and these three plus qwen3.8 do not all fit at once. Either
; keep requests to two big models at a time, or drop the launcher to `_los_router light 2`.
