; Router presets for the macOS box (olim3, M4 Pro, 48 GiB unified memory).
; Loaded by the com.zeachco.llama-router launchd agent -- see
; variants/osx/llama-router/. Keys are llama-server CLI args without the leading
; dashes. Precedence: router CLI args > model section > [*].
;
; SECTION NAMES MUST EQUAL THE IDS THE ROUTER ASSIGNS. For a multimodal model in a
; subdirectory the id is the DIRECTORY name, NOT the .gguf filename stem. A section
; whose name matches nothing is ignored with NO warning and the model silently falls
; back to [*], or to llama-server's 4096-token default. Verify with `los-check`,
; never by guessing from filenames.
;
; Three keys here are preset-only and are not CLI args: load-on-startup,
; stop-timeout, dedup-cache-models.
version = 1

; =============================== memory budget ===============================
; RAM is not the binding constraint -- the Metal wired limit is. ggml-metal checks
; every allocation against MTLDevice.recommendedMaxWorkingSetSize; past that macOS
; pages GPU-resident tensors and throughput collapses with NOTHING logged.
;
; com.zeachco.iogpu-limit (a root LaunchDaemon, installed by
; variants/osx/llama-router/install-wired-limit.sh) raises the cap from the ~36 GiB
; default to 42 GiB, because the sysctl resets to 0 on every reboot.
;
; --models-max is 4 and only three models exist here, so the router NEVER evicts:
; eviction is by model COUNT, never by bytes. Once each id has been touched all
; three stay resident, so the figures below are the steady state, not a worst case.
;
;   weights + projectors    3.11 + 0.99   gemma-4-E2B-it
;                         + 4.98 + 0.99   gemma-4-E4B-it
;                         +16.46 + 0.93   Qwen3.8-27B         = ~27.5 GiB
;   KV cache, q8_0, at the c/np below                         = ~ 5.0 GiB
;   per-child compute + graph buffers (~1 GiB x 3)            = ~ 3.0 GiB
;                                                               ---------
;                                                               ~35.5 of 42 GiB
;
; That leaves ~6 GiB of Metal headroom and only ~6 GiB of the 48 for macOS. Running
; Chromium and a build on top of three resident models WILL swap; `los-unload` and
; `los-free` are the levers, and dropping Qwen3.8-27B to c = 65536 gives back ~2 GiB.
;
; THE KV FIGURES ABOVE ARE ESTIMATES, extrapolated from the Ryzen box's measurement
; of this Qwen model. The only sound method is ryzen-llm-setup.md Phase 2: read the
; child's "KV buffer size" line out of ~/Library/Logs/llama-router/router.log,
; divide by c to get bytes/token, then scale. Do that before raising anything.
;
; Do NOT add `mlock`. Weights are mmap'd out of ~/models and Metal addresses the
; mapped pages directly; mlock would wire all 27.5 GiB permanently and fight the
; page cache instead of letting an idle model's pages be reclaimed.
; =============================================================================

[*]
; Offload everything. Unlike a discrete GPU there is no partial-offload sweet spot --
; host and device memory are the same physical DRAM.
ngl = 999
; Also the precondition for the quantized KV cache below.
fa = on
; Use each model's own chat template from the GGUF. This is what makes tool calls and
; multimodal content blocks parse at all.
jinja = true
; q8_0 KV halves cache cost for a quality delta that is not measurable in agent use.
; k and v must MATCH: llama-context.cpp rejects a mismatch for MLA-style archs.
cache-type-k = q8_0
cache-type-v = q8_0
; ngram speculation needs no draft model and pays off on coding loops, where output
; re-emits large spans of the prompt. Default is "none", so it must be named.
; Alternatives: ngram-simple, ngram-map-k, ngram-map-k4v.
spec-type = ngram-mod
; np divides c between slots, so the two ALWAYS move together. Left unset,
; llama-server picks 4 slots that each ADVERTISE the full c while sharing one cache;
; concurrent agent requests then starve it and get a 500 "Context size has been
; exceeded." that also wipes every active slot's prompt cache. Same reasoning as the
; comment in variants/shared/_llama.sh -- in router mode it applies per child.
np = 1
c = 32768

; ---------------------------------------------------------------------------------
; Vision-capable, 2B effective. Cheapest thing on the box: classification, fan-out
; subagents, screenshot OCR. Section name = the ~/models/gemma-4-E2B-it/ DIRECTORY.
; np = 2 so a fan-out of small tasks does not queue. 65536/2 = 32768 per slot.
[gemma-4-E2B-it]
c = 65536
np = 2

; ---------------------------------------------------------------------------------
; Vision-capable, 4B effective. Interactive default.
[gemma-4-E4B-it]
c = 65536
np = 2

; ---------------------------------------------------------------------------------
; 27B / 16.46 GiB of weights -- over a third of the Metal budget on its own.
; np = 1 gives the whole context to one conversation: this is the "think hard" model,
; not the fan-out model.
[Qwen3.8-27B]
c = 131072
np = 1
; 16 GiB takes well over the default 10 s to tear down, and a force-kill mid-teardown
; leaves the Metal heap fragmented for the next load.
stop-timeout = 30

; --- optional: MTP speculative decode -------------------------------------------
; All three repos ship a multi-token-prediction head, and fetch-models-osx.sh already
; downloads them to ~/models-drafts (OUTSIDE --models-dir -- a drafts/ subdirectory
; would be scanned as one multi-shard model). draft-mtp is a real decode win on a
; bandwidth-bound Apple GPU, but it replaces the [*] ngram-mod setting per model and
; the accept rate has not been measured here yet. Enable one model at a time and read
; the accept rate off /metrics before keeping it:
;
; [Qwen3.8-27B]
; spec-type = draft-mtp
; model-draft = /Users/olivier/models-drafts/mtp-Qwen3.8-27B-Q4_0.gguf
;
; [gemma-4-E4B-it]
; spec-type = draft-mtp
; model-draft = /Users/olivier/models-drafts/mtp-gemma-4-E4B-it-Q8_0.gguf
;
; [gemma-4-E2B-it]
; spec-type = draft-mtp
; model-draft = /Users/olivier/models-drafts/mtp-gemma-4-E2B-it-Q8_0.gguf
