# Herdr configuration -- stowed from dotfiles on macOS (variants/osx/setup.sh).
#
# Two other things write to this file, so expect it to change under you:
#   - Herdr itself (onboarding state, `herdr channel set`, and `herdr update`,
#     which regenerates the whole file)
#   - bin/herdr-config, which patches `theme.name` on every `theme` switch and
#     appends the [keys] table from configs/herdr/keys.toml on every setup run
# Neither of those lands in git: a clean filter (.gitattributes, registered by
# variants/shared/setup.sh as `herdr-config git-clean`) pins theme.name to
# "terminal" and strips the [keys] table, and setup restores both after a
# clone. The keymap lives in keys.toml only -- do not add bindings here.
#
# Validate any edit with `herdr config check`.

onboarding = false

[theme]
name = "terminal"
auto_switch = false
