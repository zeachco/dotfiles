# Ubuntu-specific Alacritty config with tmux

[general]
import = [
    "~/.config/alacritty/base.toml",
    "~/dotfiles/themes/current/alacritty.toml"
]

[terminal.shell]
program = "/usr/bin/env"
# -A attaches to the "main" session when it exists, creates it otherwise.
args = ["tmux", "new-session", "-A", "-s", "main"]

[font]
size = 11.0

[font.normal]
family = "VictorMono Nerd Font"
style = "Regular"

[font.bold]
family = "VictorMono Nerd Font"
style = "Bold"

[font.italic]
family = "VictorMono Nerd Font"
style = "Italic"
